name: pages

# Publishes the static site/ folder (index, 404, privacy, terms, style,
# site.js, fonts, img) to GitHub Pages. Pages can only serve the repo
# root or docs/ directly, so the site goes out through the GitHub Actions
# source instead.
# Before pushing site changes, run: python -I scripts/check-site.py (links, ids, em dashes).
# One-time owner step: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs: deploy-pages could not find an artifact uploaded earlier in the
# same job (actions/deploy-pages#451, failed twice on 2026-11-21), so the
# upload finishes in its own job before the deploy job starts.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
